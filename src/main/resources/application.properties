spring.application.name=ReceiptToExcel
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/ledger;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
spring.config.import=optional:file:./application-local.properties
app.data-dir=./data
app.ollama-enabled=${OLLAMA_ENABLED:false}
app.ollama-url=http://127.0.0.1:11434
app.ollama-model=${OLLAMA_MODEL:gemma3:4b}
app.sheets-id=${GOOGLE_SHEET_ID:}
app.sheets-credentials=${GOOGLE_SERVICE_ACCOUNT_FILE:}
