# 기본 실행 설정입니다. 개인 연결 정보는 Git에서 제외한 application-local.properties에 작성합니다.
spring.application.name=ReceiptToExcel
# 이 PC 안에서만 접속을 받습니다. PORT 환경변수로 포트를 바꿀 수 있습니다.
server.address=127.0.0.1
server.port=${PORT:8080}
# 별도 DB 서버 없이 프로젝트의 data/ledger 파일에 장부를 저장합니다. 실행 작업 폴더가 기준입니다.
spring.datasource.url=jdbc:h2:file:./data/ledger;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
# 시작할 때 schema.sql을 실행하며, 테이블이 이미 있으면 기존 장부를 유지합니다.
spring.sql.init.mode=always
# 업로드 요청 용량 제한입니다. 실제 이미지 형식과 픽셀 수는 ReceiptImages에서도 검사합니다.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
server.error.include-message=never
# 로컬 설정 파일은 선택 사항입니다. 없으면 아래의 무료 기본 모드로 실행됩니다.
spring.config.import=optional:file:./application-local.properties
# 증빙 이미지와 거래처 보정 사전 폴더입니다. DB 파일 위치는 위 datasource 설정으로 별도 지정합니다.
app.data-dir=./data
# 선택 기능: 로컬 AI를 켜지 않으면 Windows OCR와 규칙을 사용합니다.
app.ollama-enabled=${OLLAMA_ENABLED:false}
app.ollama-url=http://127.0.0.1:11434
app.ollama-model=${OLLAMA_MODEL:gemma3:4b}
# 선택 기능: 문서 ID와 서비스 계정 키 경로가 모두 있어야 구글 직접 전송을 사용할 수 있습니다.
app.sheets-id=${GOOGLE_SHEET_ID:}
app.sheets-credentials=${GOOGLE_SERVICE_ACCOUNT_FILE:}
