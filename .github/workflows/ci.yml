name: ReceiptToExcel CI

# GitHub Desktop의 커밋 후 Push origin까지 해야 실행됩니다. 태그만 올리면 실행하지 않습니다.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 테스트에 저장소 쓰기 권한이나 별도 API 키는 필요하지 않습니다.
permissions:
  contents: read

# 같은 브랜치에 연속으로 올리면 이전 검증은 취소하고 최신 코드를 검사합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows / Java 17
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      # 외부 Action의 실행 코드를 확인한 커밋으로 고정합니다. 주석은 해당 메이저 버전입니다.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          cache: maven

      # 실제 OCR를 실행하지 않고 Windows PowerShell 5에서 스크립트 문법이 올바른지 확인합니다.
      - name: Check Windows OCR script syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = (Resolve-Path -LiteralPath 'src/main/resources/scripts/windows-ocr.ps1').Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Output $_.Message }
            throw 'Windows OCR script contains syntax errors.'
          }

      # 테스트 건수를 고정하지 않고 src/test의 전체 테스트와 JAR 빌드를 매번 검증합니다.
      # 테스트는 임시 DB·합성 이미지·가짜 OCR 응답을 사용합니다. 개인 장부나 실제 영수증은 필요 없습니다.
      - name: Build and run all tests
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify

      - name: Summarize tests
        if: ${{ always() }}
        run: |
          $reports = @(Get-ChildItem -Path 'target/surefire-reports/TEST-*.xml' -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            'No test reports were produced. Check the preceding build logs.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $total = 0
          $failures = 0
          $errors = 0
          $skipped = 0
          foreach ($report in $reports) {
            [xml]$result = Get-Content -LiteralPath $report.FullName -Raw
            $total += [int]$result.testsuite.tests
            $failures += [int]$result.testsuite.failures
            $errors += [int]$result.testsuite.errors
            $skipped += [int]$result.testsuite.skipped
          }
          @(
            '## Automated test results'
            '| Tests | Failures | Errors | Skipped |'
            '| --- | --- | --- | --- |'
            "| $total | $failures | $errors | $skipped |"
            ''
            'Receipt recognition with real Windows OCR and portable EXE launch require separate manual checks.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      # 실패했을 때도 상세 결과를 내려받을 수 있도록 작은 테스트 보고서만 7일 보관합니다.
      - name: Save test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-windows-java17
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 7
